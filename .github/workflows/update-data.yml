name: Update channel data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch iptv-org data
        run: |
          git clone --depth 1 --branch gh-pages https://github.com/iptv-org/api.git /tmp/iptv-api
          ls -l /tmp/iptv-api/*.json

      - name: Build country data
        run: node tools/build-data.mjs --api /tmp/iptv-api --out data

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'No channel changes.'
            exit 0
          fi
          git commit -m 'chore: refresh iptv-org channel data'
          git push
